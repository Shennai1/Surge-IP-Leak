name: Update IP leak rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "supplements/**"
      - "tests/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-ip-leak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test rule builder
        run: python -m unittest discover -s tests -v

      - name: Build rules
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git add rules/IPLeak.list
          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update IP leak rules"
          git push
